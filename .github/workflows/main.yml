name: Main

on:
  push:
    branches:
      - main

concurrency:
  group: main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ vars.VPS_ARCH || 'amd64' }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o bingusbot .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bingusbot-linux
          path: bingusbot

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || 'bingus' }}
    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: bingusbot-linux

      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking yes\n' \
            "$VPS_HOST" "$VPS_USER" > ~/.ssh/config

      - name: Upload binary
        run: scp bingusbot vps:/opt/bingusbot/bingusbot.new

      - name: Restart bot
        run: |
          ssh vps '
            set -e
            cd /opt/bingusbot
            chmod 755 bingusbot.new
            mv bingusbot.new bingusbot
            sudo systemctl restart bingusbot
          '

      - name: Check bot is running
        run: |
          if ! ssh vps '
            pid=$(systemctl show -p MainPID --value bingusbot)
            sleep 15
            [ "$pid" != 0 ] &&
              systemctl is-active --quiet bingusbot &&
              [ "$(systemctl show -p MainPID --value bingusbot)" = "$pid" ]
          '; then
            echo "Bingus Bot isn't running. Recent logs:"
            ssh vps 'journalctl -u bingusbot -n 50 --no-pager' || true
            exit 1
          fi
